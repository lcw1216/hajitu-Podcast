<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>题目集 - 哈基图的妙妙屋</title>
        <link rel="stylesheet" href="Podcast.css">
        <style>
            .ps-wrap {
                display: flex;
                width: 100%;
                max-width: 100%;
                min-height: calc(100vh - 4.375rem);
                margin-top: 0;
            }

            .ps-sidebar {
                width: 16.25rem;
                flex-shrink: 0;
                padding: 1.875rem 1.25rem;
                border-right: 1px solid rgba(255, 255, 255, 0.06);
                color: #d1d5db;
                font-size: 0.9375rem;
                line-height: 1.6;
            }

            .ps-group { margin-bottom: 0.5rem; }

            .ps-group-label {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0.4rem 0.6rem;
                cursor: pointer;
                color: #e5e7eb;
                font-weight: 500;
                border-radius: 0.375rem;
                user-select: none;
            }
            .ps-group-label:hover { color: #fff; }

            .ps-group-label::after {
                content: "›";
                color: #6b7280;
                font-size: 1.1rem;
                line-height: 1;
                transform: rotate(90deg);
                transition: transform 0.2s;
            }
            .ps-group.open > .ps-group-label::after { transform: rotate(0deg); }

            .ps-subitems {
                list-style: none;
                margin: 0.25rem 0 0.25rem 0.75rem;
                padding: 0;
                border-left: 1px solid rgba(255, 255, 255, 0.08);
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.25s ease;
            }
            .ps-group.open > .ps-subitems { max-height: 31.25rem; }

            .ps-subitems li a {
                display: block;
                padding: 0.4rem 0.75rem;
                color: #9ca3af;
                text-decoration: none;
                border-radius: 0.25rem;
                font-size: 0.875rem;
            }
            .ps-subitems li a:hover { color: #fff; background: rgba(255,255,255,0.04); }
            .ps-subitems li a.active { color: rgb(80, 140, 250); font-weight: 600; }

            .ps-main {
                flex: 1;
                padding: 1.875rem 2.5rem;
                min-width: 0;
            }

            .ps-title {
                font-size: 2.25rem;
                font-weight: 700;
                color: #6b7280;
                margin: 0 0 1.25rem 0;
            }

            .ps-card {
                background-color: rgb(14, 17, 23);
                border: 1px solid #000;
                border-radius: 0.625rem;
                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
                overflow: hidden;
            }

            .ps-card-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0.875rem 1.25rem;
                background-color: rgba(255, 255, 255, 0.02);
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                color: #e5e7eb;
                font-size: 1rem;
                cursor: pointer;
                user-select: none;
            }
            .ps-card-head .ps-icon {
                display: inline-flex;
                width: 1.5rem;
                height: 1.5rem;
                background-color: rgb(80, 140, 250);
                color: #fff;
                border-radius: 0.25rem;
                align-items: center;
                justify-content: center;
                font-size: 0.875rem;
                margin-right: 0.625rem;
            }
            .ps-card-head .ps-name { display: flex; align-items: center; flex: 1; }
            .ps-card-head .ps-toggle {
                color: #6b7280;
                font-size: 1.1rem;
                transition: transform 0.2s;
            }
            .ps-card.open .ps-card-head .ps-toggle { transform: rotate(180deg); }

            .ps-card-body {
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease;
            }
            .ps-card.open .ps-card-body { max-height: 75rem; }

            .ps-problem {
                display: flex;
                align-items: center;
                padding: 0.75rem 1.25rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
                color: #d1d5db;
                font-size: 0.9375rem;
                cursor: pointer;
                transition: background-color 0.15s ease;
            }
            .ps-problem:hover { background-color: rgba(255, 255, 255, 0.03); }
            .ps-problem:last-child { border-bottom: none; }

            .ps-problem .ps-dot {
                display: inline-flex;
                width: 1.25rem;
                height: 1.25rem;
                background-color: #22c55e;
                border-radius: 50%;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-size: 0.75rem;
                margin-right: 0.75rem;
                flex-shrink: 0;
            }
            .ps-problem .ps-dot.dim { background-color: #4b5563; }
            .ps-problem .ps-text { flex: 1; }
            .ps-problem .ps-text a { color: rgb(80, 140, 250); text-decoration: none; }
            .ps-problem .ps-text a:hover { text-decoration: underline; }


            body.light-mode .ps-sidebar { color: #374151; border-right-color: rgba(0,0,0,0.08); }
            body.light-mode .ps-group-label { color: #111827; }
            body.light-mode .ps-subitems { border-left-color: rgba(0,0,0,0.1); }
            body.light-mode .ps-subitems li a { color: #4b5563; }
            body.light-mode .ps-subitems li a:hover { color: #111827; background: rgba(0,0,0,0.04); }
            body.light-mode .ps-subitems li a.active { color: rgb(52, 120, 246); }
            body.light-mode .ps-title { color: #6b7280; }
            body.light-mode .ps-card-head { color: #111827; background-color: rgba(0,0,0,0.02); border-bottom-color: rgba(0,0,0,0.06); }
            body.light-mode .ps-problem { color: #374151; border-bottom-color: rgba(0,0,0,0.04); }
            body.light-mode .ps-problem:hover { background-color: rgba(0,0,0,0.03); }
            body.light-mode .ps-problem .ps-dot.dim { background-color: #cbd5e1; color: #6b7280; }
            body.light-mode .ps-problem { background-color: #ffffff; }
            body.light-mode .ps-card { background-color: #ffffff; }

            @media (max-width: 768px) {
                .ps-wrap { flex-direction: column; }
                .ps-sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.06); }
                .ps-main { padding: 1.25rem; }
                .ps-title { font-size: 1.75rem; }
            }
        </style>
    </head>
    <body class="probelm-page">
        <nav>
            <div class="nav-content">
                <div class="top-nav">
                    <div class="logo">哈基图的妙妙屋</div>
                    <button class="theme-btn" onclick="toggleTheme()"></button>
                </div>
                <div class="menu">
                    <a href="index.html">简介</a>
                    <a href="Project-File.html">项目文件</a>
                    <a href="probelm-set.html" class="active">题目集</a>
                    <a href="acm-groupwork.html">ACM-GroupWork</a>
                </div>
            </div>
        </nav>

        <div class="ps-wrap">
            <aside class="ps-sidebar">
                <div class="ps-group open">
                    <div class="ps-group-label">哈基图的题单</div>
                    <ul class="ps-subitems">
                        <li><a href="#dp" class="ps-cat-link active" data-target="dp">动态规划</a></li>
                        <li><a href="#search" class="ps-cat-link" data-target="search">搜索</a></li>
                    </ul>
                </div>
            </aside>

            <main class="ps-main">
                <!-- 动态规划区：独立的标题 + 独立卡片 -->
                <section class="ps-section" id="dp">
                    <h1 class="ps-title">动态规划</h1>

                    <div class="ps-card open">
                        <div class="ps-card-head" onclick="this.parentElement.classList.toggle('open')">
                            <span class="ps-name"><span class="ps-icon">✎</span>线性 DP</span>
                            <span class="ps-toggle">▾</span>
                        </div>
                        <div class="ps-card-body">
                            <div class="ps-problem" data-id="dp-001">
                                <span class="ps-dot">✓</span>
                                <span class="ps-text">洛谷：<a href="https://www.luogu.com.cn" target="_blank">[蓝桥杯 2023 国 Python B] 背包问题</a></span>
                            </div>
                            <div class="ps-problem" data-id="dp-002">
                                <span class="ps-dot">✓</span>
                                <span class="ps-text">洛谷：<a href="https://www.luogu.com.cn" target="_blank">[蓝桥杯 2024 国 A] 最长上升子序列</a></span>
                            </div>
                        </div>
                    </div>

                    <div class="ps-card open">
                        <div class="ps-card-head" onclick="this.parentElement.classList.toggle('open')">
                            <span class="ps-name"><span class="ps-icon">✎</span>区间 DP</span>
                            <span class="ps-toggle">▾</span>
                        </div>
                        <div class="ps-card-body">
                            <div class="ps-problem" data-id="dp-003">
                                <span class="ps-dot">✓</span>
                                <span class="ps-text">洛谷：<a href="https://www.luogu.com.cn" target="_blank">[蓝桥杯 2024 国 B] 编辑距离</a></span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 搜索区：与动态规划完全独立的另一个大区 -->
                <section class="ps-section" id="search" style="display:none;">
                    <h1 class="ps-title">搜索</h1>

                    <div class="ps-card open">
                        <div class="ps-card-head" onclick="this.parentElement.classList.toggle('open')">
                            <span class="ps-name"><span class="ps-icon">✎</span>DFS</span>
                            <span class="ps-toggle">▾</span>
                        </div>
                        <div class="ps-card-body">
                            <div class="ps-problem" data-id="se-001">
                                <span class="ps-dot">✓</span>
                                <span class="ps-text">洛谷：<a href="https://www.luogu.com.cn" target="_blank">[蓝桥杯 2023 国 A] 全排列问题</a></span>
                            </div>
                            <div class="ps-problem" data-id="se-002">
                                <span class="ps-dot">✓</span>
                                <span class="ps-text">洛谷：<a href="https://www.luogu.com.cn" target="_blank">[蓝桥杯 2023 国研究生组] 剪枝搜索</a></span>
                            </div>
                        </div>
                    </div>

                    <div class="ps-card open">
                        <div class="ps-card-head" onclick="this.parentElement.classList.toggle('open')">
                            <span class="ps-name"><span class="ps-icon">✎</span>BFS</span>
                            <span class="ps-toggle">▾</span>
                        </div>
                        <div class="ps-card-body">
                            <div class="ps-problem" data-id="se-003">
                                <span class="ps-dot">✓</span>
                                <span class="ps-text">洛谷：<a href="https://www.luogu.com.cn" target="_blank">[蓝桥杯 2024 国 Java B] 迷宫最短路</a></span>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <script>
            // 侧边栏分类切换：点击"动态规划"/"搜索"时，只显示对应 section
            (function () {
                var links = document.querySelectorAll('.ps-cat-link');
                var sections = document.querySelectorAll('.ps-section');

                function show(targetId) {
                    sections.forEach(function (s) {
                        s.style.display = (s.id === targetId) ? '' : 'none';
                    });
                    links.forEach(function (a) {
                        if (a.getAttribute('data-target') === targetId) {
                            a.classList.add('active');
                        } else {
                            a.classList.remove('active');
                        }
                    });
                }

                links.forEach(function (a) {
                    a.addEventListener('click', function (e) {
                        e.preventDefault();
                        var target = this.getAttribute('data-target');
                        if (!target) return;
                        show(target);
                        // 滚动到顶部，让用户从标题开始看
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                });
            })();

            // 题目完成状态管理：使用 localStorage 存储到本地电脑
            (function () {
                var STORAGE_KEY = 'probelm-set:done';

                // 读取已完成的题目 ID
                function loadDone() {
                    try {
                        var raw = localStorage.getItem(STORAGE_KEY);
                        if (!raw) return {};
                        var data = JSON.parse(raw);
                        return (data && typeof data === 'object') ? data : {};
                    } catch (e) {
                        return {};
                    }
                }

                // 保存已完成的题目 ID
                function saveDone(map) {
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
                    } catch (e) { /* 忽略写入失败 */ }
                }

                // 应用已完成状态到 DOM
                function applyDone(map) {
                    document.querySelectorAll('.ps-problem').forEach(function (row) {
                        var id = row.getAttribute('data-id');
                        if (!id) return;
                        var dot = row.querySelector('.ps-dot');
                        if (map[id]) {
                            row.classList.add('done');
                            if (dot) dot.classList.remove('dim');
                        } else {
                            row.classList.remove('done');
                            if (dot) dot.classList.add('dim');
                        }
                    });
                }

                var doneMap = loadDone();

                // 绑定点击切换
                document.querySelectorAll('.ps-problem').forEach(function (row) {
                    var id = row.getAttribute('data-id');
                    if (!id) return;
                    row.addEventListener('click', function () {
                        if (doneMap[id]) {
                            delete doneMap[id];
                        } else {
                            doneMap[id] = true;
                        }
                        saveDone(doneMap);
                        applyDone(doneMap);
                    });
                });

                // 初始应用一次（确保刷新后能恢复状态）
                applyDone(doneMap);
            })();

            // 侧边栏分组点击展开/收起
            document.querySelectorAll('.ps-group-label').forEach(function (label) {
                label.addEventListener('click', function () {
                    this.parentElement.classList.toggle('open');
                });
            });
        </script>
        <script src="script.js"></script>
    </body>
</html>
