<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF-AI 刷题助手 - 哈基图的妙妙屋</title>
    <link rel="stylesheet" href="Podcast.css">
    <style>
        .cf-chat-wrap {
            width: 100%;
            max-width: 52rem;
            margin: 0 auto;
            padding: 0 1rem 2rem;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 6.5rem);
        }
        /* ===== 顶部用户栏（集成 CF 账号） ===== */
        .cf-topbar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1rem;
            background-color: rgb(14, 17, 23);
            border: 1px solid #000;
            border-radius: 0.75rem 0.75rem 0 0;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .cf-topbar .cf-avatar {
            width: 2.2rem; height: 2.2rem;
            border-radius: 50%;
            background: linear-gradient(135deg, rgb(80,140,250), rgb(120,80,250));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 1rem;
            flex-shrink: 0;
        }
        .cf-topbar .cf-top-title { font-weight: 600; font-size: 1rem; color: #fff; }
        .cf-topbar .cf-top-sub { font-size: 0.72rem; color: rgb(140,140,140); }
        .cf-topbar .cf-spacer { flex: 1; }

        .cf-top-btn {
            padding: 0.3rem 0.7rem;
            font-size: 0.75rem;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            color: rgb(173,173,173);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .cf-top-btn:hover { border-color: rgb(250,80,80); color: rgb(250,80,80); background: rgba(250,80,80,0.08); }
        body.light-mode .cf-top-btn { color: rgb(100,100,100); border-color: rgba(0,0,0,0.15); }
        body.light-mode .cf-top-btn:hover { border-color: rgb(220,50,50); color: rgb(220,50,50); }

        /* ===== 消息区 ===== */
        .cf-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 1.25rem 1rem;
            background-color: rgb(10, 12, 16);
            border-left: 1px solid #000;
            border-right: 1px solid #000;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
        }
        .cf-msg-row { display: flex; gap: 0.5rem; align-items: flex-end; }
        .cf-msg-row.user { flex-direction: row-reverse; }
        .cf-msg-avatar {
            width: 1.9rem; height: 1.9rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700; color: #fff; flex-shrink: 0;
        }
        .cf-msg-avatar.ai { background: linear-gradient(135deg, rgb(80,140,250), rgb(120,80,250)); }
        .cf-msg-avatar.me { background: linear-gradient(135deg, rgb(250,150,80), rgb(250,80,120)); }
        .cf-msg {
            max-width: 85%;
            padding: 0.6rem 0.95rem;
            border-radius: 0.9rem;
            font-size: 0.9rem;
            line-height: 1.6;
            word-break: break-word;
            position: relative;
        }
        .cf-msg.user {
            background: rgba(80,140,250,0.18);
            border: 1px solid rgba(80,140,250,0.35);
            border-bottom-right-radius: 0.25rem;
        }
        .cf-msg.ai {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-bottom-left-radius: 0.25rem;
        }
        .cf-msg.sys {
            align-self: center;
            background: rgba(255,255,255,0.07);
            font-size: 0.78rem;
            color: rgb(173,173,173);
            border-radius: 999px;
            padding: 0.35rem 1rem;
            max-width: 95%;
        }
        .cf-msg code { background: rgba(0,0,0,0.45); padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.82rem; }
        .cf-msg pre {
            background: rgba(0,0,0,0.5);
            padding: 0.7rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            font-size: 0.78rem;
            line-height: 1.5;
            margin: 0.4rem 0;
        }
        .cf-msg pre code { background: none; padding: 0; }
        .cf-msg b { color: rgb(80,140,250); }

        /* 代码块复制按钮 */
        .cf-code-block { position: relative; margin: 0.4rem 0; }
        .cf-code-block pre { margin: 0; }
        .cf-code-copy {
            position: absolute;
            top: 0.35rem;
            right: 0.35rem;
            padding: 0.15rem 0.55rem;
            font-size: 0.7rem;
            border-radius: 0.375rem;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5);
            color: rgb(200,200,200);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 2;
        }
        .cf-code-block:hover .cf-code-copy { opacity: 1; }
        .cf-code-copy:hover { background: rgb(80,140,250); color: #fff; }
        .cf-code-copy.copied { opacity: 1; background: rgb(80,200,100); color: #fff; border-color: rgb(80,200,100); }

        /* 消息内操作按钮（提交确认） */
        .cf-msg-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; flex-wrap: wrap; }
        .cf-inline-btn {
            padding: 0.3rem 0.9rem;
            font-size: 0.78rem;
            border-radius: 999px;
            border: 1px solid rgb(80,140,250);
            color: rgb(80,140,250);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cf-inline-btn:hover { background: rgb(80,140,250); color: #fff; }
        .cf-inline-btn.green { border-color: rgb(80,200,100); color: rgb(80,200,100); }
        .cf-inline-btn.green:hover { background: rgb(80,200,100); color: #fff; }
        .cf-inline-btn.red { border-color: rgb(250,80,80); color: rgb(250,80,80); }
        .cf-inline-btn.red:hover { background: rgb(250,80,80); color: #fff; }
        .cf-inline-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 题目卡片（聊天内） */
        .cf-problem-chip {
            display: inline-flex; align-items: center; gap: 0.4rem;
            background: rgba(80,140,250,0.12);
            border: 1px solid rgba(80,140,250,0.3);
            border-radius: 0.5rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            color: rgb(80,140,250);
            cursor: pointer;
            margin-top: 0.4rem;
        }
        .cf-problem-chip:hover { background: rgba(80,140,250,0.22); }

        /* ===== 输入区 ===== */
        .cf-input-area {
            display: flex; align-items: flex-end; gap: 0.5rem;
            padding: 0.75rem 1rem;
            background-color: rgb(14, 17, 23);
            border: 1px solid #000;
            border-radius: 0 0 0.75rem 0.75rem;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .cf-input-area textarea {
            flex: 1;
            resize: none;
            min-height: 2.6rem;
            max-height: 8rem;
            padding: 0.6rem 0.9rem;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 0.75rem;
            background-color: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            line-height: 1.5;
        }
        .cf-input-area textarea:focus { border-color: rgb(80,140,250); }
        .cf-send-btn {
            width: 3rem; height: 3rem;
            border-radius: 50%;
            border: none;
            background: rgb(80,140,250);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .cf-send-btn:hover { background: rgb(60,120,240); transform: scale(1.05); }
        .cf-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* 题面弹窗 */
        .cf-statement {
            max-height: 60vh; overflow-y: auto; font-size: 0.9rem; line-height: 1.7;
            word-break: break-word; color: rgb(200,200,200);
            background: rgba(0,0,0,0.25); border-radius: 0.5rem; padding: 1rem 1.25rem;
        }
        .cf-statement h2, .cf-statement h3 { font-size: 1rem; margin: 0.8rem 0 0.4rem; color: rgb(220,220,220); }
        .cf-statement p { margin: 0.4rem 0; }
        .cf-statement pre { background: rgba(0,0,0,0.45); padding: 0.6rem 0.8rem; border-radius: 0.375rem; overflow-x: auto; font-size: 0.8rem; margin: 0.4rem 0; }
        .cf-statement code { background: rgba(0,0,0,0.35); padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.85rem; }
        .cf-statement sub { font-size: 0.72em; }
        .cf-statement sup { font-size: 0.72em; }
        .cf-loading { display: inline-block; width: 0.9rem; height: 0.9rem; border: 2px solid rgba(255,255,255,0.2); border-top-color: rgb(80,140,250); border-radius: 50%; animation: cf-spin 0.8s linear infinite; vertical-align: middle; }
        @keyframes cf-spin { to { transform: rotate(360deg); } }
        .cf-verdict { font-size: 0.75rem; padding: 0.2rem 0.55rem; border-radius: 999px; }
        .cf-verdict.OK { background: rgba(80,200,100,0.15); color: rgb(80,200,100); }
        .cf-verdict.bad { background: rgba(250,80,80,0.15); color: rgb(250,80,80); }
        .cf-verdict.pending { background: rgba(255,180,80,0.15); color: rgb(255,180,80); }

        /* 主题适配 */
        body.light-mode .cf-topbar { background-color: #fff; border-color: #ccc; }
        body.light-mode .cf-topbar .cf-top-title { color: #000; }
        body.light-mode .cf-messages { background-color: rgb(248,248,248); border-color: #ddd; }
        body.light-mode .cf-msg.ai { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }
        body.light-mode .cf-msg.sys { background: rgba(0,0,0,0.06); color: rgb(100,100,100); }
        body.light-mode .cf-msg code, body.light-mode .cf-msg pre { background: rgba(0,0,0,0.06); }
        body.light-mode .cf-input-area { background-color: #fff; border-color: #ccc; }
        body.light-mode .cf-input-area textarea { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.12); color: #000; }
        body.light-mode .cf-statement { background: rgba(0,0,0,0.03); color: rgb(60,60,60); }
        body.light-mode .cf-problem-chip { background: rgba(52,120,246,0.1); }
    </style>
</head>

    <div class="main-container">
        <div class="cf-chat-wrap">
            <!-- 顶部：用户信息 + CF 账号 -->
            <div class="cf-topbar">
                <div class="cf-avatar" id="cf-avatar">?</div>
                <div>
                    <div class="cf-top-title" id="cf-top-title">CF-AI 刷题助手</div>

    <!-- 题面弹窗 -->
    <div id="cf-statement-modal" class="acm-modal" style="display:none;">
        <div class="acm-modal-overlay" onclick="document.getElementById('cf-statement-modal').style.display='none'"></div>
        <div class="acm-modal-content box" style="max-width: 40rem;">
            <h3 id="cf-stmt-title"></h3>
            <div class="cf-statement" id="cf-statement-body">加载中...</div>
            <div class="acm-modal-actions">

            </div>

    <script src="script.js"></script>
    <script>
        (function () {
            var state = {
                current: null,
                translation: '',
                statementEn: '',
                sessionId: null,
                streaming: false,
                lastCode: '',          // AI 最近生成的代码（用于提交）
                submissionTimer: null,
                pendingSubmit: false   // 是否等待用户确认提交
            };
            var $ = function (id) { return document.getElementById(id); };
            var messagesEl = $('cf-messages');
            var inputEl = $('cf-input');

            // ===== 会话持久化（localStorage：刷新后恢复当前题目/会话） =====
            var CF_STATE_KEY = 'cf-trainer:state';
            function saveState() {
                try {
                    localStorage.setItem(CF_STATE_KEY, JSON.stringify({
                        current: state.current,
                        translation: state.translation,
                        statementEn: state.statementEn,
                        sessionId: state.sessionId,
                        lastCode: state.lastCode
                    }));
                } catch (e) { /* ignore */ }
            }
            function restoreState() {
                try {
                    var raw = localStorage.getItem(CF_STATE_KEY);
                    if (!raw) return;
                    var d = JSON.parse(raw);
                    if (d.current) state.current = d.current;
                    if (d.translation) state.translation = d.translation;
                    if (d.statementEn) state.statementEn = d.statementEn;
                    if (d.sessionId) state.sessionId = d.sessionId;
                    if (d.lastCode) state.lastCode = d.lastCode;
                } catch (e) { /* ignore */ }
            }
            function clearState() {
                try { localStorage.removeItem(CF_STATE_KEY); } catch (e) {}
            }

            // ===== 通用 =====
            function api(url, opts) {
                opts = opts || {};
                return fetch(url, {
                    method: opts.method || 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    body: opts.body ? JSON.stringify(opts.body) : undefined,
                    credentials: 'same-origin'
                }).then(function (r) { return r.json().catch(function () { return {}; }); });
            }

            function esc(s) {
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            // ===== LaTeX 渲染 =====
            function renderLatex(text) {
                return text.replace(/\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g, function (m, block, inline) {
                    var expr = (block || inline || '').trim();
                    var out = expr
                        .replace(/([A-Za-z0-9])\s*_\s*\{([^}]+)\}/g, '$1<sub>$2</sub>')
                        .replace(/([A-Za-z0-9])\s*_\s*([A-Za-z0-9])/g, '$1<sub>$2</sub>')
                        .replace(/([A-Za-z0-9])\s*\^\s*\{([^}]+)\}/g, '$1<sup>$2</sup>')
                        .replace(/([A-Za-z0-9])\s*\^\s*([A-Za-z0-9])/g, '$1<sup>$2</sup>')
                        .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '<span style="display:inline-block;text-align:center;vertical-align:middle;"><span style="display:block;border-bottom:1px solid currentColor;padding:0 3px;">$1</span><span style="display:block;padding:0 3px;">$2</span></span>')
                        .replace(/\\le\b/g, '≤').replace(/\\geq\b/g, '≥').replace(/\\lt\b/g, '&lt;').replace(/\\gt\b/g, '&gt;')
                        .replace(/\\neq\b/g, '≠').replace(/\\approx\b/g, '≈').replace(/\\times\b/g, '×')
                        .replace(/\\cdot\b/g, '·').replace(/\\dots\b/g, '…').replace(/\\ldots\b/g, '…')
                        .replace(/\\pm\b/g, '±').replace(/\\infty\b/g, '∞').replace(/\\in\b/g, '∈')
                        .replace(/\\bmod\b/g, ' mod ').replace(/\\pmod\{([^}]*)\}/g, ' (mod $1)')
                        .replace(/\\sum\b/g, 'Σ').replace(/\\prod\b/g, '∏').replace(/\\sqrt\b/g, '√')
                        .replace(/\\to\b/g, '→').replace(/\\rightarrow\b/g, '→').replace(/\\leftarrow\b/g, '←')
                        .replace(/\\_/g, '_').replace(/\\%/g, '%').replace(/\\\$/g, '$').replace(/\\([a-zA-Z]+)/g, '$1');
                    return out;
                });
            }

            function renderMarkdown(text) {
                var codeBlocks = [];
                // 先提取代码块（原始代码存数组，仅转义一次），避免双重转义
                var s = text.replace(/```(\w*)\n?([\s\S]*?)```/g, function (_, lang, code) {
                    var idx = codeBlocks.length;
                    codeBlocks.push(code);
                    return '\u0000CB' + idx + '\u0000';
                });
                s = esc(s);
                s = renderLatex(s);
                // 还原代码块（代码块内保留真实换行，pre 自然换行显示）
                s = s.replace(/\u0000CB(\d+)\u0000/g, function (_, i) {
                    var code = codeBlocks[parseInt(i)];
                    return '<div class="cf-code-block"><button class="cf-code-copy" data-code="' + encodeURIComponent(code) + '">📋 复制</button><pre><code>' + esc(code) + '</code></pre></div>';
                });
                s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
                // 仅对非代码块部分换行转 <br>（代码块内保留真实换行）
                var out = '';
                var parts = s.split(/(<div class="cf-code-block">[\s\S]*?<\/div>)/g);
                for (var i = 0; i < parts.length; i++) {
                    if (/^<div class="cf-code-block">/.test(parts[i])) {
                        out += parts[i];
                    } else {
                        out += parts[i].replace(/\n/g, '<br>');
                    }
                }
                return out;
            }

            // 从 Markdown 提取第一个代码块
            function extractCode(text) {
                var m = text.match(/```(?:\w+)?\n([\s\S]*?)```/);
                return m ? m[1].trim() : '';
            }

            // ===== 消息渲染 =====
            function addMsg(role, content, opts) {
                opts = opts || {};
                var row = document.createElement('div');
                row.className = 'cf-msg-row ' + role;

                var avatar = document.createElement('div');
                avatar.className = 'cf-msg-avatar ' + (role === 'user' ? 'me' : 'ai');
                avatar.textContent = role === 'user' ? '我' : 'AI';
                row.appendChild(avatar);

                var msg = document.createElement('div');
                msg.className = 'cf-msg ' + role;
                var body = document.createElement('div');
                body.innerHTML = content === '' ? '<span class="cf-loading"></span> <span style="font-size:0.78rem;color:rgb(120,120,120);">AI 思考中...</span>' : renderMarkdown(content);
                msg.appendChild(body);
                row.appendChild(msg);
                messagesEl.appendChild(row);
                messagesEl.scrollTop = messagesEl.scrollHeight;
                return { row: row, msg: msg, body: body };
            }

            function addSys(text) {
                var div = document.createElement('div');
                div.className = 'cf-msg sys';
                div.innerHTML = renderMarkdown(text);
                messagesEl.appendChild(div);
                messagesEl.scrollTop = messagesEl.scrollHeight;
                return div;
            }

            // ===== 身份（无需 ACM 登录，未登录以访客身份使用） =====
            function setupIdentity() {
                return api('/api/me').then(function (d) {
                    if (d.user) {
                        $('cf-top-title').textContent = d.user.username + ' 的刷题助手';
                        $('cf-avatar').textContent = (d.user.username || '?').charAt(0).toUpperCase();
                    } else {
                        $('cf-top-title').textContent = '访客的刷题助手';
                        $('cf-avatar').textContent = '客';
                    }
                    $('cf-top-sub').textContent = '输入 1~6 或直接聊天';
                    return d.user;
                });
            }

            // ===== 抽题（无设置，直接随机） =====
            function pickRandom() {
                api('/api/cf/random').then(function (d) {
                        if (d.error) {
                            if (d.error === '您已完成全部题目') {
                                addSys('🎉 ' + d.error + '！可以换难度/标签再刷，或去题目集回顾。');
                            } else {
                                addSys('⚠️ ' + d.error);
                            }
                            return;
                        }
                        state.current = d.problem;
                        state.translation = '';
                        state.statementEn = '';
                        state.sessionId = null;
                        state.lastCode = '';
                        saveState();
                        if (d.problem.statementZh) {
                            state.translation = d.problem.statementZh;
                            var m = addMsg('ai', '📖 **题目：' + d.problem.key + ' - ' + d.problem.name + '（难度 ' + d.problem.rating + '）**');
                            // 题目信息点击查看题面
                            var chip = document.createElement('div');
                            chip.className = 'cf-problem-chip';
                            chip.textContent = '📋 查看中文题面';
                            chip.addEventListener('click', openStatementModal);
                            m.msg.appendChild(chip);
                            addSys('输入 4 要提示，5 重复题面，2 生成代码，或直接和我讨论思路');
                        }
                    });
            }

            function openStatementModal() {
                if (!state.current) return;
                var modal = $('cf-statement-modal');
                $('cf-stmt-title').textContent = state.current.key + ' - ' + state.current.name +
                    (state.current.rating ? '（难度 ' + state.current.rating + '）' : '');
                var content = state.translation || state.statementEn || '';
                $('cf-statement-body').innerHTML = renderMarkdown(content);
                modal.style.display = 'flex';
            }

            // ===== 对话（SSE 流式） =====
            // opts.analysis: 携带题面让 AI 分析题解（仅命令 6 时使用）
            function sendToAi(text, opts) {
                opts = opts || {};
                inputEl.value = '';
                var m = addMsg('user', esc(text));
                var ai = addMsg('ai', '');
                state.streaming = true;
                $('cf-send').disabled = true;

                var payload = {
                    message: text,
                    problemKey: state.current ? state.current.key : '',
                    problemTitle: state.current ? state.current.name : '',
                    sessionId: state.sessionId
                };
                if (opts.analysis && state.translation) {
                    payload.analysisStatement = state.translation;
                }
                fetch('/api/cf/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    credentials: 'same-origin'
                }).then(function (r) {
                        var reader = r.body.getReader();
                        var decoder = new TextDecoder();
                        var acc = '';
                        function pump() {
                            return reader.read().then(function (res) {
                                if (res.done) {
                                    state.streaming = false;
                                    $('cf-send').disabled = false;
                                    if (acc) {
                                        ai.body.innerHTML = renderMarkdown(acc);
                                        // 检测代码块 → 提供提交入口
                                        var code = extractCode(acc);
                                        if (code && state.current) {
                                            state.lastCode = code;
                                            renderSubmitActions(ai.msg, code);
                                        }
                                    }
                                    saveState();
                                    return;
                                }
                                var text2 = decoder.decode(res.value, { stream: true });
                                var parts = text2.split('\n');
                                parts.forEach(function (line) {
                                    line = line.trim();
                                    if (!line.startsWith('data:')) return;
                                    var payload2 = line.slice(5).trim();
                                    if (payload2 === '[DONE]') return;
                                    try {
                                        var j = JSON.parse(payload2);
                                        if (j.sessionId) { state.sessionId = j.sessionId; }
                                        else if (j.error) { acc = '❌ ' + j.error; }
                                        else if (j.delta) { acc += j.delta; }
                                    } catch (e) { /* ignore */ }
                                });
                                if (acc) ai.body.innerHTML = renderMarkdown(acc);
                                messagesEl.scrollTop = messagesEl.scrollHeight;
                                return pump();
                            });
                        }
                        return pump();
                    }).catch(function (e) {
                        state.streaming = false;
                        $('cf-send').disabled = false;
                        ai.body.innerHTML = '❌ 请求失败：' + esc(e.message);
                    });
            }

            // AI 代码块下的操作按钮：一键复制代码 + 跳转 CF 提交页
            function renderSubmitActions(msgEl, code) {
                var actions = document.createElement('div');
                actions.className = 'cf-msg-actions';
                // 复制代码
                var copyBtn = document.createElement('button');
                copyBtn.className = 'cf-inline-btn green';
                copyBtn.textContent = '📋 复制代码';
                copyBtn.addEventListener('click', function () { copyCode(code, copyBtn); });
                actions.appendChild(copyBtn);
                // 跳转 CF 提交页
                if (state.current) {
                    var linkBtn = document.createElement('a');
                    linkBtn.className = 'cf-inline-btn';
                    linkBtn.textContent = '🔗 去 CF 提交';
                    linkBtn.href = 'https://codeforces.com/problemset/submit/' + state.current.contestId + '/' + state.current.index;
                    linkBtn.target = '_blank';
                    linkBtn.rel = 'noopener';
                    actions.appendChild(linkBtn);
                }
                msgEl.appendChild(actions);
            }

            // 一键复制代码到剪贴板
            function copyCode(code, btn) {
                var done = function () {
                    if (btn) {
                        var old = btn.textContent;
                        btn.textContent = '✅ 已复制';
                        btn.disabled = true;
                        setTimeout(function () { btn.textContent = old; btn.disabled = false; }, 1500);
                    }
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(code).then(done).catch(function () { fallbackCopy(code); done(); });
                } else {
                    fallbackCopy(code);
                    done();
                }
            }

            function fallbackCopy(text) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                document.body.removeChild(ta);
            }

            // 代码块复制按钮（事件委托：动态内容也能生效，优先用原始代码 data-code）
            document.addEventListener('click', function (e) {
                var btn = e.target.closest ? e.target.closest('.cf-code-copy') : null;
                if (!btn) return;
                var code = '';
                if (btn.getAttribute('data-code')) {
                    try { code = decodeURIComponent(btn.getAttribute('data-code')); } catch (err) { code = ''; }
                }
                if (!code) {
                    var block = btn.parentElement;
                    var codeEl = block ? block.querySelector('pre code') : null;
                    if (codeEl) code = codeEl.textContent || '';
                }
                if (!code) return;
                var done = function () {
                    btn.textContent = '✅ 已复制';
                    btn.classList.add('copied');
                    setTimeout(function () { btn.textContent = '📋 复制'; btn.classList.remove('copied'); }, 1500);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(code).then(done).catch(function () { fallbackCopy(code); done(); });
                } else {
                    fallbackCopy(code);
                    done();
                }
            });

            // 命令 3：给出 CF 提交页链接 + 复制代码
            function confirmSubmit() {
                if (!state.current) { addSys('⚠️ 请先抽题'); return; }
                if (!state.lastCode) { addSys('⚠️ 还没有代码，输入 2 生成代码'); return; }
                var link = 'https://codeforces.com/problemset/submit/' + state.current.contestId + '/' + state.current.index;
                var m = addMsg('ai', '📤 请前往 Codeforces 提交页面粘贴代码并提交：\n\n🔗 ' + link);
                var actions = document.createElement('div');
                actions.className = 'cf-msg-actions';
                var copyBtn = document.createElement('button');
                copyBtn.className = 'cf-inline-btn green';
                copyBtn.textContent = '📋 复制代码';
                copyBtn.addEventListener('click', function () { copyCode(state.lastCode, copyBtn); });
                actions.appendChild(copyBtn);
                var goBtn = document.createElement('a');
                goBtn.className = 'cf-inline-btn';
                goBtn.textContent = '🔗 打开 CF 提交页';
                goBtn.href = link;
                goBtn.target = '_blank';
                goBtn.rel = 'noopener';
                actions.appendChild(goBtn);
                m.msg.appendChild(actions);
                addSys('💡 提交后可以回来告诉我结果，或继续讨论');
            }

            // ===== 数字命令 =====
            function handleCommand(cmd) {
                var t = String(cmd).trim();
                if (t === '1') { pickRandom(); return true; }
                if (t === '2') {
                    if (!state.current) { addSys('⚠️ 请先输入 1 抽一道题'); return true; }
                    sendToAi('按目前的思路生成完整的可提交代码');
                    return true;
                }
                if (t === '3') {
                    if (!state.current) { addSys('⚠️ 请先输入 1 抽一道题'); return true; }
                    if (!state.lastCode) { addSys('⚠️ 还没有生成代码，先输入 2 让 AI 生成代码'); return true; }
                    confirmSubmit();
                    return true;
                }
                if (t === '4') {
                    if (!state.current) { addSys('⚠️ 请先输入 1 抽一道题'); return true; }
                    sendToAi('请给我一条提示');
                    return true;
                }
                if (t === '5') {
                    if (!state.current) { addSys('⚠️ 请先输入 1 抽一道题'); return true; }
                    openStatementModal();
                    return true;
                }
                if (t === '6') {
                    if (!state.current) { addSys('⚠️ 请先输入 1 抽一道题'); return true; }
                    if (!state.translation) { addSys('⚠️ 当前题目没有题面，无法分析'); return true; }
                    sendToAi('请分析这道题的题解（看到题面后概括题意、讲解思路、给完整代码）', { analysis: true });
                    return true;
                }
                return false;
            }

            function sendMessage(text) {
                if (!text || !text.trim() || state.streaming) return;
                if (handleCommand(text)) return;
                if (!state.current) { addSys('⚠️ 请先输入 1 抽一道题'); return; }
                sendToAi(text);
            }

            $('cf-send').addEventListener('click', function () { sendMessage(inputEl.value); });
            inputEl.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(inputEl.value); }
            });

            // ===== 历史恢复（刷新后保留对话内容） =====
            function loadHistory() {
                return new Promise(function (resolve) {
                    // 1. 先从 localStorage 恢复当前题目等状态
                    restoreState();
                    // 2. 从服务器恢复最近会话消息
                    api('/api/cf/history').then(function (d) {
                        if (!d.sessions || !d.sessions.length) { resolve(); return; }
                        var latest = d.sessions[0];
                        if (!latest.msg_count) { resolve(); return; }
                        if (!state.sessionId) state.sessionId = latest.id;
                        api('/api/cf/session/' + latest.id + '/messages').then(function (d2) {
                            if (d2.error || !d2.messages || !d2.messages.length) { resolve(); return; }
                            messagesEl.innerHTML = '';
                            var title = latest.title || latest.problem_key || '上次会话';
                            addSys('🕘 已恢复上次会话：' + title);
                            (d2.messages || []).forEach(function (m) {
                                if (m.role === 'user') addMsg('user', esc(m.content));
                                else if (m.role === 'assistant') {
                                    var ai = addMsg('ai', '');
                                    ai.body.innerHTML = renderMarkdown(m.content);
                                    var code = extractCode(m.content);
                                    if (code && state.current) { state.lastCode = code; renderSubmitActions(ai.msg, code); }
                                }
                            });
                            resolve();
                        }).catch(function () { resolve(); });
                    }).catch(function () { resolve(); });
                });
            }

            // ===== 清空对话框 =====
            function clearChat() {
                if (!confirm('确定清空当前对话吗？此操作不可恢复。')) return;
                // 删除服务器会话
                if (state.sessionId) {
                    api('/api/cf/session/' + state.sessionId, { method: 'DELETE' });
                }
                // 清空本地状态
                state.current = null;
                state.translation = '';
                state.statementEn = '';
                state.sessionId = null;
                state.lastCode = '';
                clearState();
                // 清空界面
                messagesEl.innerHTML = '';
                addMsg('ai', '👋 已清空对话。\n\n📌 输入数字即可操作：\n1️⃣ 抽一道新题\n2️⃣ 生成代码\n3️⃣ 提交测评\n4️⃣ 给提示\n5️⃣ 重复显示题面\n6️⃣ 分析题解（AI 看到题面后分析）\n\n也可以直接描述你的思路，我们一起讨论~');
            }

            // ===== 清空对话框按钮 =====
            $('cf-clear-btn').addEventListener('click', clearChat);

            // ===== 初始化（无需登录，先恢复历史再显示欢迎语） =====
            setupIdentity();
            loadHistory().then(function () {
                if (messagesEl.children.length === 0) {
                    addMsg('ai', '👋 欢迎使用 **CF-AI 刷题助手**！\n\n📌 输入数字即可操作：\n1️⃣ 抽一道新题\n2️⃣ 生成代码\n3️⃣ 提交测评\n4️⃣ 给提示\n5️⃣ 重复显示题面\n6️⃣ 分析题解（AI 看到题面后分析）\n\n也可以直接描述你的思路，我们一起讨论~');
                }
            });
        })();
    </script>
