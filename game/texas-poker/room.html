<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房间选择</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <div class="window">
        <div class="room-container">
            <div class="room-header">
                <h2 class="room-title">房间列表</h2>
                <div class="room-toolbar">
                    <div class="room-search">
                        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" id="searchInput" placeholder="输入房间号搜索..." autocomplete="off">
                    </div>
                    <button class="btn btn-create" id="btnCreateRoom">+ 创建房间</button>
                </div>
            </div>

            <div class="room-list" id="roomList">
                <div class="room-loading" id="roomLoading">
                    <div class="spinner"></div>
                    <span>加载房间列表中...</span>
                </div>
                <div class="room-empty" id="roomEmpty" style="display:none">
                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>暂无可用房间</span>
                    <span class="room-empty-hint">点击"创建房间"开始游戏</span>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modalOverlay" style="display:none">
            <div class="modal">
                <h3 class="modal-title">创建房间</h3>
                <form class="modal-form" id="createRoomForm" novalidate>
                    <div class="form-group">
                        <label for="roomName">房间名称</label>
                        <input type="text" id="roomName" name="roomName" placeholder="请输入房间名称" maxlength="20">
                        <span class="error-msg" id="roomName-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="maxPlayers">最大人数</label>
                        <select id="maxPlayers" name="maxPlayers">
                            <option value="2">2 人</option>
                            <option value="4">4 人</option>
                            <option value="6">6 人</option>
                            <option value="8" selected>8 人</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="initialChips">初始筹码</label>
                        <select id="initialChips" name="initialChips">
                            <option value="500">500</option>
                            <option value="1000" selected>1000</option>
                            <option value="2000">2000</option>
                            <option value="5000">5000</option>
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-cancel" id="btnCancel">取消</button>
                        <button type="submit" class="btn btn-confirm">确认创建</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script>
        (function () {
            var API_BASE = PokerApp.API_BASE;
            var userId = localStorage.getItem('user_id');
            var username = localStorage.getItem('username');

            if (!userId) {
                window.location.href = 'login-in.html';
                return;
            }

            var roomList = document.getElementById('roomList');
            var roomLoading = document.getElementById('roomLoading');
            var roomEmpty = document.getElementById('roomEmpty');
            var searchInput = document.getElementById('searchInput');
            var modalOverlay = document.getElementById('modalOverlay');
            var toastContainer = document.getElementById('toastContainer');
            var rooms = [];

            function loadRooms() {
                showLoading();
                fetch(API_BASE + '/api/rooms')
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        if (data.ok) {
                            rooms = data.rooms;
                            hideLoading();
                            renderRooms(searchInput.value.trim());
                        } else {
                            hideLoading();
                            showToast('加载房间列表失败', 'error');
                        }
                    })
                    .catch(function(err) {
                        hideLoading();
                        showToast('网络错误', 'error');
                    });
            }

            function renderRooms(filterText) {
                var filtered = rooms;
                if (filterText) {
                    filtered = rooms.filter(function (r) {
                        return String(r.id).indexOf(filterText) !== -1 || r.name.indexOf(filterText) !== -1;
                    });
                }

                var existingCards = roomList.querySelectorAll('.room-card');
                existingCards.forEach(function (card) { card.remove(); });

                if (filtered.length === 0) {
                    roomEmpty.style.display = 'flex';
                } else {
                    roomEmpty.style.display = 'none';
                    var fragment = document.createDocumentFragment();
                    filtered.forEach(function (room) {
                        var card = createRoomCard(room);
                        fragment.appendChild(card);
                    });
                    roomList.appendChild(fragment);
                }
            }

            function createSvgElement(svgMarkup) {
                var wrapper = document.createElement('div');
                wrapper.innerHTML = svgMarkup;
                return wrapper.firstChild;
            }

            function createRoomCard(room) {
                var card = document.createElement('div');
                card.className = 'room-card';

                var headerDiv = document.createElement('div');
                headerDiv.className = 'room-card-header';

                var idSpan = document.createElement('span');
                idSpan.className = 'room-id';
                idSpan.textContent = '#' + room.id;

                var statusSpan = document.createElement('span');
                statusSpan.className = 'room-status status-waiting';
                statusSpan.textContent = '等待中';

                headerDiv.appendChild(idSpan);
                headerDiv.appendChild(statusSpan);

                var bodyDiv = document.createElement('div');
                bodyDiv.className = 'room-card-body';

                var nameDiv = document.createElement('div');
                nameDiv.className = 'room-name';
                nameDiv.textContent = room.name;

                var infoDiv = document.createElement('div');
                infoDiv.className = 'room-info';

                var infoItem1 = document.createElement('div');
                infoItem1.className = 'room-info-item';
                var svg1 = createSvgElement('<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>');
                var span1 = document.createElement('span');
                span1.textContent = '最多 ' + room.max_players + ' 人';
                infoItem1.appendChild(svg1);
                infoItem1.appendChild(span1);

                var infoItem2 = document.createElement('div');
                infoItem2.className = 'room-info-item';
                var svg2 = createSvgElement('<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>');
                var span2 = document.createElement('span');
                span2.textContent = room.initial_chips + ' 筹码';
                infoItem2.appendChild(svg2);
                infoItem2.appendChild(span2);

                infoDiv.appendChild(infoItem1);
                infoDiv.appendChild(infoItem2);

                bodyDiv.appendChild(nameDiv);
                bodyDiv.appendChild(infoDiv);

                var footerDiv = document.createElement('div');
                footerDiv.className = 'room-card-footer';

                var joinBtn = document.createElement('button');
                joinBtn.className = 'btn btn-join';
                joinBtn.setAttribute('data-room-id', room.id);
                joinBtn.textContent = '加入房间';

                footerDiv.appendChild(joinBtn);

                card.appendChild(headerDiv);
                card.appendChild(bodyDiv);
                card.appendChild(footerDiv);

                return card;
            }

            function showToast(message, type) {
                PokerApp.showToast(message, type, toastContainer);
            }

            function showLoading() {
                roomLoading.style.display = 'flex';
                roomEmpty.style.display = 'none';
                var existingCards = roomList.querySelectorAll('.room-card');
                existingCards.forEach(function (card) { card.remove(); });
            }

            function hideLoading() {
                roomLoading.style.display = 'none';
            }

            function openModal() {
                modalOverlay.style.display = 'flex';
                document.getElementById('roomName').value = '';
                document.getElementById('roomName-error').textContent = '';
                document.getElementById('roomName').classList.remove('input-error');
            }

            function closeModal() {
                modalOverlay.style.display = 'none';
            }

            function joinRoom(roomId) {
                var btn = document.querySelector('.btn-join[data-room-id="' + roomId + '"]');
                if (btn) {
                    btn.textContent = '加入中...';
                    btn.disabled = true;
                    btn.classList.add('btn-loading');
                }

                fetch(API_BASE + '/api/rooms/' + roomId + '/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: parseInt(userId) })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.ok) {
                        showToast('成功加入房间 #' + roomId, 'success');
                        localStorage.setItem('room_id', roomId);
                        setTimeout(function () {
                            window.location.href = 'index.html';
                        }, 800);
                    } else {
                        showToast(data.error ? data.error.message : '加入失败', 'error');
                        if (btn) {
                            btn.textContent = '加入房间';
                            btn.disabled = false;
                            btn.classList.remove('btn-loading');
                        }
                    }
                })
                .catch(function(err) {
                    showToast('网络错误', 'error');
                    if (btn) {
                        btn.textContent = '加入房间';
                        btn.disabled = false;
                        btn.classList.remove('btn-loading');
                    }
                });
            }

            roomList.addEventListener('click', function (e) {
                var btn = e.target.closest('.btn-join');
                if (!btn || btn.disabled) return;
                var roomId = btn.getAttribute('data-room-id');
                joinRoom(roomId);
            });

            searchInput.addEventListener('input', function () {
                renderRooms(this.value.trim());
            });

            document.getElementById('btnCreateRoom').addEventListener('click', function () {
                openModal();
            });

            document.getElementById('btnCancel').addEventListener('click', function () {
                closeModal();
            });

            modalOverlay.addEventListener('click', function (e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            document.getElementById('createRoomForm').addEventListener('submit', function (e) {
                e.preventDefault();
                var roomNameInput = document.getElementById('roomName');
                var roomNameError = document.getElementById('roomName-error');
                var roomName = roomNameInput.value.trim();

                roomNameError.textContent = '';
                roomNameInput.classList.remove('input-error');

                if (!roomName) {
                    roomNameError.textContent = '请输入房间名称';
                    roomNameInput.classList.add('input-error');
                    return;
                }
                if (roomName.length < 2) {
                    roomNameError.textContent = '房间名称至少2个字符';
                    roomNameInput.classList.add('input-error');
                    return;
                }

                var maxPlayers = parseInt(document.getElementById('maxPlayers').value);
                var initialChips = parseInt(document.getElementById('initialChips').value);

                var confirmBtn = this.querySelector('.btn-confirm');
                confirmBtn.textContent = '创建中...';
                confirmBtn.disabled = true;
                confirmBtn.classList.add('btn-loading');

                fetch(API_BASE + '/api/rooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: roomName,
                        max_players: maxPlayers,
                        initial_chips: initialChips,
                        created_by: parseInt(userId)
                    })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.ok) {
                        closeModal();
                        showToast('房间 #' + data.room_id + ' 创建成功', 'success');
                        loadRooms();
                    } else {
                        roomNameError.textContent = data.error ? data.error.message : '创建失败';
                        roomNameInput.classList.add('input-error');
                    }
                })
                .catch(function(err) {
                    roomNameError.textContent = '网络错误';
                    roomNameInput.classList.add('input-error');
                })
                .finally(function() {
                    confirmBtn.textContent = '确认创建';
                    confirmBtn.disabled = false;
                    confirmBtn.classList.remove('btn-loading');
                });
            });

            document.getElementById('roomName').addEventListener('input', function () {
                var error = document.getElementById('roomName-error');
                if (this.classList.contains('input-error')) {
                    error.textContent = '';
                    this.classList.remove('input-error');
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && modalOverlay.style.display === 'flex') {
                    closeModal();
                }
            });

            loadRooms();
        })();
    </script>
</body>
</html>
