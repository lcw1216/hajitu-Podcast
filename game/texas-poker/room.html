<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德州扑克 - 游戏房间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(30, 30, 30, 0.95);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .room-id {
            font-size: 18px;
            font-weight: 600;
        }

        .game-stage {
            padding: 5px 15px;
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
            border-radius: 15px;
            font-size: 14px;
        }

        .game-table {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .opponent-area {
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .opponent-cards {
            display: flex;
            gap: 10px;
        }

        .card-back {
            width: 60px;
            height: 84px;
            background: linear-gradient(135deg, #8B0000 0%, #CD5C5C 50%, #8B0000 100%);
            border-radius: 6px;
            border: 2px solid #fff;
        }

        .opponent-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .opponent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .opponent-name {
            font-weight: 500;
        }

        .opponent-chips {
            color: #4ade80;
            font-weight: 600;
        }

        .community-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .pot-info {
            padding: 10px 25px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid gold;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            color: gold;
        }

        .community-cards {
            display: flex;
            gap: 15px;
        }

        .card {
            width: 70px;
            height: 98px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            background: white;
            border: 2px solid #fff;
        }

        .card.red {
            color: #e53935;
        }

        .card.black {
            color: #000;
        }

        .card.empty {
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed #666;
            color: transparent;
        }

        .player-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .player-details {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .player-name {
            font-weight: 600;
            font-size: 18px;
        }

        .player-chips {
            color: #4ade80;
            font-weight: 600;
        }

        .player-cards {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .player-card {
            width: 80px;
            height: 112px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            background: white;
            border: 3px solid #fff;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .player-card:hover {
            transform: translateY(-10px);
        }

        .player-card.red {
            color: #e53935;
        }

        .player-card.black {
            color: #000;
        }

        .action-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
        }

        .action-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            transform: translateY(-3px);
        }

        .btn-fold {
            background: #e53935;
            color: white;
        }

        .btn-check {
            background: #666;
            color: white;
        }

        .btn-call {
            background: #2196F3;
            color: white;
        }

        .btn-raise {
            background: #4ade80;
            color: #000;
        }

        .btn-allin {
            background: gold;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="room-info">
            <span class="room-id">房间: </span>
            <span class="game-stage"></span>
        </div>
        <div class="header-buttons">
            <button onclick="alert('退出房间')" style="padding: 8px 20px; cursor: pointer;">退出房间</button>
        </div>
    </div>

    <div class="game-table">
        <div class="opponent-area">
            <div class="opponent-cards">
                <div class="card-back"></div>
                <div class="card-back"></div>
            </div>
            <div class="opponent-info">
                <div class="opponent-avatar"></div>
                <span class="opponent-name"></span>
                <span class="opponent-chips"></span>
            </div>
        </div>

        <div class="community-area">
            <div class="pot-info">底池: </div>
            <div class="community-cards">
                <div class="card empty"></div>
                <div class="card empty"></div>
                <div class="card empty"></div>
                <div class="card empty"></div>
                <div class="card empty"></div>
            </div>
        </div>

        <div class="player-area">
            <div class="player-cards">
                <div class="player-card"></div>
                <div class="player-card"></div>
            </div>
            <div class="player-info">
                <div class="player-avatar"></div>
                <div class="player-details">
                    <span class="player-name"></span>
                    <span class="player-chips"></span>
                </div>
            </div>
        </div>

        <div class="action-area">
            <button class="action-btn btn-fold">弃牌</button>
            <button class="action-btn btn-check">看牌</button>
            <button class="action-btn btn-call">跟注</button>
            <button class="action-btn btn-raise">加注</button>
            <button class="action-btn btn-allin">全下</button>
        </div>
    </div>
</body>
</html>
