<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德州扑克游戏</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <div class="window">
        <div class="cross-v"></div>
        <div class="cross-h"></div>
        <div class="quadrant quadrant-2">
            <div class="community-cards" id="communityCards">
                <div class="card empty"></div>
                <div class="card empty"></div>
                <div class="card empty"></div>
                <div class="card empty"></div>
                <div class="card empty"></div>
            </div>
            <div class="hand-cards" id="handCards">
                <div class="card empty">?</div>
                <div class="card empty">?</div>
            </div>
            <div class="pot-display" id="potDisplay">底池: 0</div>
        </div>
        <div class="quadrant quadrant-1">
            <div class="player-row" id="playerList">
            </div>
        </div>
        <div class="quadrant quadrant-3">
            <button class="btn" id="btnFold" disabled>弃牌</button>
            <button class="btn" id="btnCheck" disabled>让牌</button>
            <button class="btn" id="btnCall" disabled>跟注</button>
            <button class="btn" id="btnRaise" disabled>加注</button>
            <div class="raise-control" id="raiseControl" style="display:none">
                <input type="range" id="raiseSlider" min="0" max="1000" value="0">
                <span id="raiseAmount">0</span>
            </div>
        </div>
        <div class="quadrant quadrant-4">
            <div class="chip-row">
                <span class="chip-label">剩余筹码</span>
                <span class="chip-value" id="remainingChips">0</span>
            </div>
            <div class="chip-row">
                <span class="chip-label">当局筹码</span>
                <span class="chip-value" id="currentChips">0</span>
            </div>
            <div class="chip-row">
                <span class="chip-label">当前阶段</span>
                <span class="chip-value" id="phaseDisplay">等待中</span>
            </div>
        </div>
        <div class="toast-container" id="toastContainer"></div>
        <div class="result-overlay" id="resultOverlay" style="display:none">
            <div class="result-content">
                <h2 class="result-title">摊牌结果</h2>
                <div id="resultWinners"></div>
                <div id="resultPlayers"></div>
                <button class="btn" id="btnDismissResult">关闭</button>
            </div>
        </div>
    </div>
    <script>
        (function () {
            const API_BASE = PokerApp.API_BASE;
            const userId = localStorage.getItem('user_id');
            const username = localStorage.getItem('username');
            const roomId = localStorage.getItem('room_id');
            const wsUrl = "ws://127.0.0.1:9002";
            let ws = null;
            let gameState = null;
            let isMyTurn = false;

            if (!userId || !roomId) {
                window.location.href = 'room.html';
                return;
            }

            const communityCardsEl = document.getElementById('communityCards');
            const handCardsEl = document.getElementById('handCards');
            const potDisplayEl = document.getElementById('potDisplay');
            const playerListEl = document.getElementById('playerList');
            const remainingChipsEl = document.getElementById('remainingChips');
            const currentChipsEl = document.getElementById('currentChips');
            const phaseDisplayEl = document.getElementById('phaseDisplay');
            const btnFold = document.getElementById('btnFold');
            const btnCheck = document.getElementById('btnCheck');
            const btnCall = document.getElementById('btnCall');
            const btnRaise = document.getElementById('btnRaise');
            const raiseControl = document.getElementById('raiseControl');
            const raiseSlider = document.getElementById('raiseSlider');
            const raiseAmountEl = document.getElementById('raiseAmount');
            const toastContainer = document.getElementById('toastContainer');

            const phaseNames = {
                "idle": "等待中",
                "preflop": "翻牌前",
                "flop": "翻牌",
                "turn": "转牌",
                "river": "河牌",
                "showdown": "摊牌"
            };

            function connectWebSocket() {
                ws = new WebSocket(wsUrl);

                ws.onopen = function() {
                    const token = localStorage.getItem('token');
                    ws.send(JSON.stringify({
                        type: "join",
                        data: { user_id: parseInt(userId), room_id: roomId, token: token }
                    }));
                };

                ws.onmessage = function(event) {
                    const msg = JSON.parse(event.data);
                    if (msg.type === "game_state") {
                        gameState = msg.data;
                        renderGameState();
                    } else if (msg.type === "hand_result") {
                        showHandResult(msg.data);
                    } else if (msg.type === "error") {
                        showToast(msg.data.message, 'error');
                    } else if (msg.type === "joined") {
                        showToast('已加入游戏', 'success');
                    }
                };

                ws.onclose = function() {
                    showToast('连接断开，5秒后重连...', 'error');
                    setTimeout(connectWebSocket, 5000);
                };

                ws.onerror = function() {
                    showToast('WebSocket连接错误', 'error');
                };
            }

            function renderGameState() {
                if (!gameState) return;

                phaseDisplayEl.textContent = phaseNames[gameState.phase] || gameState.phase;
                potDisplayEl.textContent = "底池: " + gameState.pot;

                renderCommunityCards(gameState.communityCards);
                renderPlayerList(gameState.players);
                updateActionButtons();

                const myPlayer = gameState.players.find(function(p) { return p.id === parseInt(userId); });
                if (myPlayer) {
                    remainingChipsEl.textContent = myPlayer.chips;
                    currentChipsEl.textContent = myPlayer.currentBet;
                    renderHandCards(myPlayer.hand);
                }
            }

            function renderCommunityCards(cards) {
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 5; i++) {
                    const cardEl = document.createElement('div');
                    if (i < cards.length) {
                        const card = cards[i];
                        cardEl.className = 'card';
                        cardEl.textContent = card.rank + card.suit;
                    } else {
                        cardEl.className = 'card empty';
                    }
                    fragment.appendChild(cardEl);
                }
                communityCardsEl.innerHTML = '';
                communityCardsEl.appendChild(fragment);
            }

            function renderHandCards(hand) {
                const fragment = document.createDocumentFragment();
                if (hand && hand.length === 2) {
                    hand.forEach(function(card) {
                        const cardEl = document.createElement('div');
                        cardEl.className = 'card';
                        cardEl.textContent = card.rank + card.suit;
                        fragment.appendChild(cardEl);
                    });
                    handCardsEl.innerHTML = '';
                    handCardsEl.appendChild(fragment);
                } else {
                    handCardsEl.innerHTML = '<div class="card empty">?</div><div class="card empty">?</div>';
                }
            }

            function renderPlayerList(players) {
                const fragment = document.createDocumentFragment();
                players.forEach(function(player) {
                    const row = document.createElement('div');
                    row.className = 'player-row';
                    if (player.isCurrent) row.classList.add('current-player');

                    const stateText = player.state === 'active' ? '存活' : (player.state === 'folded' ? '弃牌' : '出局');
                    const actionText = player.action || '-';

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'player-name' + (player.isCurrent ? ' active' : '');
                    nameSpan.textContent = player.name;

                    const actionSpan = document.createElement('span');
                    actionSpan.className = 'status';
                    actionSpan.textContent = actionText;

                    const stateSpan = document.createElement('span');
                    stateSpan.className = 'status';
                    stateSpan.textContent = stateText;

                    const chipSpan = document.createElement('span');
                    chipSpan.className = 'chip-value';
                    chipSpan.textContent = player.chips;

                    row.appendChild(nameSpan);
                    row.appendChild(actionSpan);
                    row.appendChild(stateSpan);
                    row.appendChild(chipSpan);
                    fragment.appendChild(row);
                });
                playerListEl.innerHTML = '';
                playerListEl.appendChild(fragment);
            }

            function updateActionButtons() {
                if (!gameState) return;

                const myPlayer = gameState.players.find(function(p) { return p.id === parseInt(userId); });
                isMyTurn = myPlayer && myPlayer.isCurrent && gameState.phase !== 'idle' && gameState.phase !== 'showdown';

                btnFold.disabled = !isMyTurn;
                btnCheck.disabled = !isMyTurn;
                btnCall.disabled = !isMyTurn;
                btnRaise.disabled = !isMyTurn;

                if (isMyTurn) {
                    const needCall = gameState.currentBet - myPlayer.currentBet;
                    btnCheck.style.display = needCall === 0 ? 'inline-block' : 'none';
                    btnCall.style.display = needCall > 0 ? 'inline-block' : 'none';
                    if (needCall > 0) {
                        btnCall.textContent = '跟注 ' + needCall;
                    }

                    const minRaise = gameState.currentBet + gameState.minRaise;
                    if (myPlayer.chips + myPlayer.currentBet >= minRaise) {
                        raiseControl.style.display = 'block';
                        raiseSlider.min = minRaise;
                        raiseSlider.max = myPlayer.chips + myPlayer.currentBet;
                        raiseSlider.value = minRaise;
                        raiseAmountEl.textContent = minRaise;
                    } else {
                        raiseControl.style.display = 'none';
                    }
                } else {
                    raiseControl.style.display = 'none';
                }
            }

            function sendAction(action, amount) {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                const data = { type: "player_action", data: { action: action } };
                if (amount) data.data.amount = amount;
                ws.send(JSON.stringify(data));
            }

            function showHandResult(data) {
                var winnersEl = document.getElementById('resultWinners');
                var playersEl = document.getElementById('resultPlayers');

                var wHtml = '<h3 class="result-section">赢家</h3>';
                if (data.winners && data.winners.length > 0) {
                    data.winners.forEach(function(w) {
                        wHtml += '<div class="result-winner">';
                        wHtml += '<span class="result-player-name">' + (w.playerId === parseInt(userId) ? '你' : '玩家' + w.playerId) + '</span>';
                        wHtml += '<span class="result-hand-name">' + (w.handName || '自动获胜') + '</span>';
                        wHtml += '<span class="result-win-amount">+' + w.winAmount + '</span>';
                        wHtml += '</div>';
                    });
                }
                winnersEl.innerHTML = wHtml;

                var pHtml = '<h3 class="result-section">所有手牌</h3>';
                if (data.players && data.players.length > 0) {
                    data.players.forEach(function(p) {
                        pHtml += '<div class="result-player' + (p.handRank < 0 ? ' result-auto-win' : '') + '">';
                        pHtml += '<span class="result-player-name">' + (p.playerId === parseInt(userId) ? '你' : '玩家' + p.playerId) + '</span>';
                        if (p.hand && p.hand.length > 0) {
                            pHtml += '<span class="result-hand-cards">';
                            p.hand.forEach(function(c) {
                                pHtml += c.rank + c.suit + ' ';
                            });
                            pHtml += '</span>';
                        }
                        pHtml += '<span class="result-hand-name">' + (p.handName || '—') + '</span>';
                        pHtml += '</div>';
                    });
                }
                playersEl.innerHTML = pHtml;
                document.getElementById('resultOverlay').style.display = 'flex';
            }

            function showToast(message, type) {
                PokerApp.showToast(message, type, toastContainer);
            }

            btnFold.addEventListener('click', function() { sendAction('fold'); });
            btnCheck.addEventListener('click', function() { sendAction('check'); });
            btnCall.addEventListener('click', function() { sendAction('call'); });
            btnRaise.addEventListener('click', function() {
                const amount = parseInt(raiseSlider.value);
                sendAction('raise', amount);
            });

            document.getElementById('btnDismissResult').addEventListener('click', function() {
                document.getElementById('resultOverlay').style.display = 'none';
            });

            raiseSlider.addEventListener('input', function() {
                raiseAmountEl.textContent = this.value;
            });

            connectWebSocket();
        })();
    </script>
</body>
</html>
