<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德州扑克 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05) 1px, transparent 1px),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .floating-cards {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-card {
            position: absolute;
            top: 0;
            left: 0;
            font-size: 100px;
            opacity: 1;
            animation: float linear infinite;
            will-change: transform;
        }

        @keyframes float {
            0% {
                transform: translate3d(0, -120px, 0) rotate(0deg);
            }
            100% {
                transform: translate3d(0, 110vh, 0) rotate(360deg);
            }
        }

        .floating-card:nth-child(1) { left: 10%; animation-duration: 12s; animation-delay: 0s; }
        .floating-card:nth-child(2) { left: 25%; animation-duration: 15s; animation-delay: -5s; }
        .floating-card:nth-child(3) { left: 40%; animation-duration: 10s; animation-delay: -10s; }
        .floating-card:nth-child(4) { left: 55%; animation-duration: 14s; animation-delay: -3s; }
        .floating-card:nth-child(5) { left: 70%; animation-duration: 16s; animation-delay: -8s; }
        .floating-card:nth-child(6) { left: 85%; animation-duration: 13s; animation-delay: -12s; }
        .floating-card:nth-child(7) { left: 15%; animation-duration: 11s; animation-delay: -7s; }
        .floating-card:nth-child(8) { left: 60%; animation-duration: 14s; animation-delay: -15s; }
        .floating-card:nth-child(9) { left: 75%; animation-duration: 12s; animation-delay: -2s; }

        .floating-card.black {
            color: #333333;
        }

        .floating-card.red {
            color: #e53935;
        }

        

        .login-container {
            background: rgba(45, 45, 45, 0.95);
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 400px;
            position: relative;
            z-index: 10;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #e0e0e0;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #555555;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #3a3a3a;
            color: #e0e0e0;
        }

        .form-group input:focus {
            outline: none;
            border-color: #777777;
            background: #444444;
            box-shadow: 0 0 0 4px rgba(119, 119, 119, 0.2);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #555555;
            cursor: pointer;
        }

        .remember-me span {
            color: #aaa;
            font-size: 14px;
        }

        .forgot-password {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #e0e0e0;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #555555 0%, #333333 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(85, 85, 85, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .register-link p {
            color: #aaa;
            font-size: 14px;
        }

        .register-link a {
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: #e0e0e0;
            text-decoration: underline;
        }

        .error-message {
            background: #ffeaea;
            color: #d32f2f;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #d32f2f;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .card-suit {
            position: absolute;
            font-size: 40px;
            opacity: 0.1;
        }

        .card-suit.spade {
            top: -20px;
            left: -20px;
            color: #000000;
        }

        .card-suit.heart {
            bottom: -20px;
            right: -20px;
            color: #c62828;
        }

        .card-suit.club {
            top: -20px;
            right: -20px;
            color: #000000;
        }

        .card-suit.diamond {
            bottom: -20px;
            left: -20px;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="floating-cards">
        <span class="floating-card black">♠</span>
        <span class="floating-card red">♥</span>
        <span class="floating-card black">♣</span>
        <span class="floating-card red">♦</span>
        <span class="floating-card black">♠</span>
        <span class="floating-card red">♥</span>
        <span class="floating-card black">♣</span>
        <span class="floating-card red">♦</span>
        <span class="floating-card black">♠</span>
    </div>

    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🃏</div>
            <h1>德州扑克</h1>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <div class="remember-row">
                <label class="remember-me">
                    <input type="checkbox" name="remember" id="remember">
                    <span>记住我</span>
                </label>
                <a href="#" class="forgot-password">忘记密码？</a>
            </div>

            <button type="submit" class="login-btn">登 录</button>
        </form>

        <div class="register-link">
            <p>还没有账号？<a href="#">立即注册</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            if (username.length < 3) {
                showError('用户名至少需要3个字符');
                return;
            }

            if (password.length < 6) {
                showError('密码至少需要6个字符');
                return;
            }

            console.log('登录尝试:', { username: username });
            alert('登录功能开发中...');
        });

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.classList.add('show');
            
            setTimeout(() => {
                errorElement.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
