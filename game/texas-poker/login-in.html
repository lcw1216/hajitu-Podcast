<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <div class="window">
        <div class="login-container">
            <h2 class="login-title">登录</h2>
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username">
                    <span class="error-msg" id="username-error"></span>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="切换密码可见性">
                            <svg class="icon-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span class="error-msg" id="password-error"></span>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>记住我</span>
                    </label>
                </div>
                <button type="submit" class="btn login-btn">登录</button>
                <div class="form-options" style="margin-top: 10px; text-align: center;">
                    <span>还没有账号？</span>
                    <a href="#" id="showRegister">立即注册</a>
                </div>
            </form>

            <form class="login-form" id="registerForm" novalidate style="display:none">
                <h2 class="login-title">注册</h2>
                <div class="form-group">
                    <label for="reg-username">用户名</label>
                    <input type="text" id="reg-username" name="username" placeholder="请输入用户名（2-20字符）" autocomplete="username">
                    <span class="error-msg" id="reg-username-error"></span>
                </div>
                <div class="form-group">
                    <label for="reg-password">密码</label>
                    <input type="password" id="reg-password" name="password" placeholder="请输入密码" autocomplete="new-password">
                    <span class="error-msg" id="reg-password-error"></span>
                </div>
                <button type="submit" class="btn login-btn">注册</button>
                <div class="form-options" style="margin-top: 10px; text-align: center;">
                    <span>已有账号？</span>
                    <a href="#" id="showLogin">返回登录</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        (function () {
            var API_BASE = PokerApp.API_BASE;
            var toggleBtn = document.getElementById('togglePassword');
            var passwordInput = document.getElementById('password');
            var iconEye = toggleBtn.querySelector('.icon-eye');
            var iconEyeOff = toggleBtn.querySelector('.icon-eye-off');

            function sha256(message) {
                return PokerApp.sha256(message);
            }

            toggleBtn.addEventListener('click', function () {
                var isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                iconEye.style.display = isPassword ? 'none' : 'block';
                iconEyeOff.style.display = isPassword ? 'block' : 'none';
            });

            var loginForm = document.getElementById('loginForm');
            var registerForm = document.getElementById('registerForm');
            var usernameInput = document.getElementById('username');
            var usernameError = document.getElementById('username-error');
            var passwordError = document.getElementById('password-error');

            function clearErrors() {
                usernameError.textContent = '';
                passwordError.textContent = '';
                usernameInput.classList.remove('input-error');
                passwordInput.classList.remove('input-error');
            }

            function validateLoginForm() {
                var valid = true;
                clearErrors();

                var username = usernameInput.value.trim();
                if (!username) {
                    usernameError.textContent = '请输入用户名';
                    usernameInput.classList.add('input-error');
                    valid = false;
                } else if (username.length < 2) {
                    usernameError.textContent = '用户名至少2个字符';
                    usernameInput.classList.add('input-error');
                    valid = false;
                } else if (username.length > 20) {
                    usernameError.textContent = '用户名不超过20个字符';
                    usernameInput.classList.add('input-error');
                    valid = false;
                }

                var password = passwordInput.value;
                if (!password) {
                    passwordError.textContent = '请输入密码';
                    passwordInput.classList.add('input-error');
                    valid = false;
                }

                return valid;
            }

            loginForm.addEventListener('submit', function (e) {
                e.preventDefault();
                if (validateLoginForm()) {
                    var loginBtn = loginForm.querySelector('.login-btn');
                    loginBtn.textContent = '登录中...';
                    loginBtn.disabled = true;
                    loginBtn.classList.add('btn-loading');

                    sha256(passwordInput.value).then(function(hashedPassword) {
                        return fetch(API_BASE + '/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: usernameInput.value.trim(),
                                password: hashedPassword
                            })
                        });
                    })
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        if (data.ok) {
                            localStorage.setItem('user_id', data.user_id);
                            localStorage.setItem('username', data.username);
                            localStorage.setItem('chips', data.chips);
                            window.location.href = 'room.html';
                        } else {
                            passwordError.textContent = data.error ? data.error.message : '登录失败';
                            passwordInput.classList.add('input-error');
                        }
                    })
                    .catch(function(err) {
                        passwordError.textContent = '网络错误，请检查服务器是否运行';
                        passwordInput.classList.add('input-error');
                    })
                    .finally(function() {
                        loginBtn.textContent = '登录';
                        loginBtn.disabled = false;
                        loginBtn.classList.remove('btn-loading');
                    });
                }
            });

            var regUsernameInput = document.getElementById('reg-username');
            var regUsernameError = document.getElementById('reg-username-error');
            var regPasswordInput = document.getElementById('reg-password');
            var regPasswordError = document.getElementById('reg-password-error');

            registerForm.addEventListener('submit', function (e) {
                e.preventDefault();
                var valid = true;
                regUsernameError.textContent = '';
                regPasswordError.textContent = '';
                regUsernameInput.classList.remove('input-error');
                regPasswordInput.classList.remove('input-error');

                var username = regUsernameInput.value.trim();
                if (!username) {
                    regUsernameError.textContent = '请输入用户名';
                    regUsernameInput.classList.add('input-error');
                    valid = false;
                } else if (username.length < 2) {
                    regUsernameError.textContent = '用户名至少2个字符';
                    regUsernameInput.classList.add('input-error');
                    valid = false;
                } else if (username.length > 20) {
                    regUsernameError.textContent = '用户名不超过20个字符';
                    regUsernameInput.classList.add('input-error');
                    valid = false;
                }

                var password = regPasswordInput.value;
                if (!password) {
                    regPasswordError.textContent = '请输入密码';
                    regPasswordInput.classList.add('input-error');
                    valid = false;
                } else if (password.length < 6) {
                    regPasswordError.textContent = '密码至少6个字符';
                    regPasswordInput.classList.add('input-error');
                    valid = false;
                }

                if (!valid) return;

                var regBtn = registerForm.querySelector('.login-btn');
                regBtn.textContent = '注册中...';
                regBtn.disabled = true;

                sha256(password).then(function(hashedPassword) {
                    return fetch(API_BASE + '/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: username,
                            password: hashedPassword
                        })
                    });
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.ok) {
                        alert('注册成功！请登录');
                        document.getElementById('showLogin').click();
                    } else {
                        regUsernameError.textContent = data.error ? data.error.message : '注册失败';
                        regUsernameInput.classList.add('input-error');
                    }
                })
                .catch(function(err) {
                    regUsernameError.textContent = '网络错误';
                    regUsernameInput.classList.add('input-error');
                })
                .finally(function() {
                    regBtn.textContent = '注册';
                    regBtn.disabled = false;
                });
            });

            document.getElementById('showRegister').addEventListener('click', function(e) {
                e.preventDefault();
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            });

            document.getElementById('showLogin').addEventListener('click', function(e) {
                e.preventDefault();
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
            });

            usernameInput.addEventListener('input', function () {
                if (usernameInput.classList.contains('input-error')) {
                    usernameError.textContent = '';
                    usernameInput.classList.remove('input-error');
                }
            });

            passwordInput.addEventListener('input', function () {
                if (passwordInput.classList.contains('input-error')) {
                    passwordError.textContent = '';
                    passwordInput.classList.remove('input-error');
                }
            });
        })();
    </script>
</body>
</html>
